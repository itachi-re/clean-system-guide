<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 548" width="1100" height="548" role="img" aria-labelledby="t d">
<title id="t">Cheat sheet graphic</title>
<desc id="d">Twelve rows pairing a task with its safest command, each marked green, amber or red by risk.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="547" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="550" y="34" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="22" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >One-page cheat sheet</text><rect x="20" y="54" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="71" r="7" fill="#1a7f37"/><text x="58" y="76" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Look before you act</text><text x="320" y="76" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >df -h  stat  ls -la  findmnt -T PATH  lsof +D DIR</text><rect x="20" y="94" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="111" r="7" fill="#1a7f37"/><text x="58" y="116" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Preview a copy</text><text x="320" y="116" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >rsync -aHAXn --itemize-changes SRC/ DEST/</text><rect x="20" y="134" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="151" r="7" fill="#9a6700"/><text x="58" y="156" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Copy a tree</text><text x="320" y="156" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >rsync -aHAX --info=progress2 SRC/ DEST/</text><rect x="20" y="174" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="191" r="7" fill="#9a6700"/><text x="58" y="196" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Copy one file, keep metadata</text><text x="320" y="196" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >cp -a --reflink=auto SRC DEST</text><rect x="20" y="214" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="231" r="7" fill="#1a7f37"/><text x="58" y="236" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Verify a copy</text><text x="320" y="236" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >rsync -aHAXnc -i SRC/ DEST/   (no output = same)</text><rect x="20" y="254" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="271" r="7" fill="#1a7f37"/><text x="58" y="276" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Checksum manifest</text><text x="320" y="276" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >find . -type f -print0 | sort -z | xargs -0 sha256sum</text><rect x="20" y="294" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="311" r="7" fill="#cf222e"/><text x="58" y="316" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Delete recoverably</text><text x="320" y="316" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >trash-put FILE   (list: trash-list)</text><rect x="20" y="334" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="351" r="7" fill="#cf222e"/><text x="58" y="356" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Delete for good (preview!)</text><text x="320" y="356" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >find DIR -name PAT -print  then add -delete</text><rect x="20" y="374" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="391" r="7" fill="#1a7f37"/><text x="58" y="396" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Find big things</text><text x="320" y="396" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >ncdu DIR   du -xh --max-depth=1 DIR | sort -h</text><rect x="20" y="414" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="431" r="7" fill="#1a7f37"/><text x="58" y="436" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Find duplicates (review!)</text><text x="320" y="436" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >jdupes -r DIR   (never auto-delete)</text><rect x="20" y="454" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="471" r="7" fill="#9a6700"/><text x="58" y="476" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Snapshot before risk</text><text x="320" y="476" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >btrfs subvolume snapshot -r SRC SNAP | zfs snapshot POOL/DS@NAME</text><rect x="20" y="494" width="1060" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><circle cx="40" cy="511" r="7" fill="#9a6700"/><text x="58" y="516" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Safe move script</text><text x="320" y="516" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >sh scripts/safe-move.sh SRC DEST_DIR</text>
</svg>
