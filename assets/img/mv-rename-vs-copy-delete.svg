<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480" role="img" aria-labelledby="t d">
<title id="t">mv: rename vs copy and delete</title>
<desc id="d">Top: on one filesystem mv is an atomic rename. Bottom: across filesystems mv copies then deletes in five phases t0 to t4; a crash during deletion at t3 can leave the source partly deleted and the copy unverified.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="479" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="550" y="34" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="22" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >mv: rename vs copy + delete</text><rect x="20" y="56" width="1060" height="120" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="40" y="82" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14.5" font-weight="bold" fill="#1a7f37" text-anchor="start" xml:space="preserve" >Same filesystem: one atomic rename (a directory-entry change, no data is copied)</text><rect x="60" y="100" width="200" height="50" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="160" y="130" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >/a/file exists</text><line x1="262" y1="125" x2="438" y2="125" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="440" y="100" width="200" height="50" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/><text x="540" y="122" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >rename() syscall</text><text x="540" y="140" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >all or nothing</text><line x1="642" y1="125" x2="818" y2="125" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="820" y="100" width="220" height="50" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="930" y="130" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >/b/file exists, /a gone</text><text x="60" y="168" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" xml:space="preserve" >A crash leaves either the old state or the new state, never half.</text><rect x="20" y="198" width="1060" height="262" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/><text x="40" y="224" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14.5" font-weight="bold" fill="#cf222e" text-anchor="start" xml:space="preserve" >Different filesystems: copy, then delete (NOT atomic)</text><rect x="50" y="246" width="170" height="66" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="135" y="270" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >t0  copy starts</text><text x="135" y="292" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >bytes flow to dest</text><line x1="222" y1="279" x2="253" y2="279" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="255" y="246" width="170" height="66" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><text x="340" y="270" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >t1  copy running</text><text x="340" y="292" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >dest is partial</text><line x1="427" y1="279" x2="458" y2="279" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="460" y="246" width="170" height="66" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="545" y="270" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >t2  copy done</text><text x="545" y="292" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >both copies exist</text><line x1="632" y1="279" x2="663" y2="279" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="665" y="246" width="170" height="66" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/><text x="750" y="270" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >t3  delete source</text><text x="750" y="292" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >source being removed</text><line x1="837" y1="279" x2="868" y2="279" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="870" y="246" width="170" height="66" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="955" y="270" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >t4  finished</text><text x="955" y="292" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >only dest remains</text><text x="50" y="346" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Where a crash leaves data:</text><circle cx="50" cy="372" r="5" fill="#9a6700"/><text x="66" y="376" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >t0 to t1: source complete, dest partial. Safe, but dest is junk until re-run.</text><circle cx="50" cy="394" r="5" fill="#cf222e"/><text x="66" y="398" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#cf222e" text-anchor="start" xml:space="preserve" >t3: source PARTIALLY deleted and dest was never checked. Real data-loss window.</text><circle cx="50" cy="416" r="5" fill="#1a7f37"/><text x="66" y="420" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1a7f37" text-anchor="start" xml:space="preserve" >Safer: copy, VERIFY, then trash the source. That is exactly what safe-move does.</text>
</svg>
