<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 484" width="1100" height="484" role="img" aria-labelledby="t d">
<title id="t">Snapshot timeline</title>
<desc id="d">Timeline: healthy system at T0, snapshot taken at T1, risky change at T2, problem noticed at T3, rollback to the snapshot at T4. A warning box says snapshots on the same disk are not backups.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="483" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="550" y="34" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="22" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Snapshot timeline around a risky change</text><text x="550" y="58" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >Tool-agnostic: btrfs, ZFS, LVM, Timeshift, snapper or a plain backup all fit this shape</text><line x1="40" y1="200" x2="1060" y2="200" stroke="#1f2328" stroke-width="3" marker-end="url(#ar)"/><circle cx="140" cy="200" r="11" fill="#1a7f37"/><text x="140" y="176" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >T0</text><text x="140" y="236" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Healthy system</text><circle cx="320" cy="200" r="11" fill="#0969da"/><text x="320" y="176" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >T1</text><text x="320" y="236" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >TAKE SNAPSHOT</text><circle cx="520" cy="200" r="11" fill="#9a6700"/><text x="520" y="176" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >T2</text><text x="520" y="236" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Risky change</text><circle cx="720" cy="200" r="11" fill="#cf222e"/><text x="720" y="176" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >T3</text><text x="720" y="236" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Problem noticed</text><circle cx="920" cy="200" r="11" fill="#1a7f37"/><text x="920" y="176" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >T4</text><text x="920" y="236" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Rolled back</text><rect x="250" y="92" width="140" height="34" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="320" y="114" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#0969da" text-anchor="middle" xml:space="preserve" >read-only, named</text><line x1="320" y1="128" x2="320" y2="184" stroke="#0969da" stroke-width="2" marker-end="url(#ar)"/><path d="M 720 252 C 720 330, 320 330, 322 262" fill="none" stroke="#0969da" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ar)"/><text x="520" y="322" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#0969da" text-anchor="middle" xml:space="preserve" >rollback / restore files from the snapshot</text><rect x="40" y="368" width="1020" height="96" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/><text x="60" y="394" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#cf222e" text-anchor="start" xml:space="preserve" >What a snapshot does NOT protect against</text><text x="60" y="418" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >A snapshot on the same disk dies with the disk. It is not a backup.</text><text x="60" y="438" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >It does not stop you deleting the snapshot, nor protect against ransomware that has root.</text><text x="60" y="458" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >Keep at least one copy on a different device, and test restoring it.</text>
</svg>
