<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
<title id="t">Decision flowchart</title>
<desc id="d">A flowchart: if data is irreplaceable take a snapshot first; if you want to keep both copies use cp -a or rsync; if moving on the same filesystem use mv -n; if moving across filesystems copy with rsync, verify, then trash the source.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="539" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="500" y="32" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="20" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Which operation do I use? Copy vs move vs rsync vs snapshot</text><polygon points="500,57.0 650.0,92 500,127.0 350.0,92" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="500" y="90" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Is the data irreplaceable</text><text x="500" y="105" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >or is the change risky?</text><line x1="500" y1="127" x2="500" y2="170" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="512" y="152" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" font-weight="normal" fill="#57606a" text-anchor="start" xml:space="preserve" >no / done</text><line x1="350" y1="92" x2="230" y2="92" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="300" y="84" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" font-weight="bold" fill="#0969da" text-anchor="start" xml:space="preserve" >yes</text><rect x="60" y="66" width="170" height="52" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="145.0" y="88" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Snapshot or backup first</text><text x="145.0" y="108" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >chapter 8</text><path d="M 145 118 L 145 150 L 440 190" fill="none" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><polygon points="500,180.0 630.0,215 500,250.0 370.0,215" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="500" y="213" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Keep both copies?</text><text x="500" y="228" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >(copy, not move)</text><line x1="630" y1="215" x2="663" y2="215" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="646" y="207" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" font-weight="bold" fill="#0969da" text-anchor="start" xml:space="preserve" >yes</text><line x1="500" y1="250" x2="500" y2="300" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="512" y="282" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" font-weight="bold" fill="#0969da" text-anchor="start" xml:space="preserve" >no: move</text><polygon points="780,180.0 895.0,215 780,250.0 665.0,215" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="780" y="213" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Remote, many files,</text><text x="780" y="228" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >or need resume?</text><line x1="780" y1="180" x2="780" y2="154" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="792" y="172" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" font-weight="bold" fill="#0969da" text-anchor="start" xml:space="preserve" >yes</text><rect x="690" y="100" width="180" height="52" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><text x="780.0" y="122" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >rsync -aHAX</text><text x="780.0" y="142" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >verify after</text><line x1="780" y1="250" x2="780" y2="290" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="792" y="274" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" font-weight="normal" fill="#57606a" text-anchor="start" xml:space="preserve" >no</text><rect x="665" y="292" width="230" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="780.0" y="314" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >cp -a --reflink=auto</text><text x="780.0" y="338" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >one local tree</text><polygon points="500,290.0 630.0,325 500,360.0 370.0,325" fill="#ffffff" stroke="#0969da" stroke-width="2"/><text x="500" y="323" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Same filesystem?</text><text x="500" y="338" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >(findmnt -T / df)</text><line x1="370" y1="325" x2="290" y2="325" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="330" y="317" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" font-weight="bold" fill="#0969da" text-anchor="start" xml:space="preserve" >yes</text><rect x="80" y="298" width="210" height="56" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><text x="185.0" y="320" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >mv -n SRC DEST</text><text x="185.0" y="344" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >atomic rename</text><line x1="500" y1="360" x2="500" y2="410" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><text x="512" y="392" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11" font-weight="bold" fill="#cf222e" text-anchor="start" xml:space="preserve" >no</text><rect x="340" y="412" width="320" height="64" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/><text x="500.0" y="434" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >rsync copy, VERIFY,</text><text x="500.0" y="451" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >then trash the source</text><text x="500.0" y="466" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="11" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >scripts/safe-move.sh</text><text x="500" y="512" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >Never rm the original until the verify step has passed.</text>
</svg>
