<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="1000" height="412" role="img" aria-labelledby="t d">
<title id="t">rsync trailing slash</title>
<desc id="d">Side by side: rsync -a SRC DEST/ creates DEST/SRC/a.txt and b.txt; rsync -a SRC/ DEST/ puts a.txt and b.txt directly in DEST.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="411" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="500" y="34" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="22" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >The rsync trailing-slash rule</text><text x="500" y="58" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >A slash on the SOURCE decides: copy the folder itself, or only what is inside it</text><rect x="30" y="80" width="440" height="270" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="250" y="106" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >no slash: the folder itself is copied</text><rect x="40" y="120" width="420" height="34" rx="6" fill="#0d1117" stroke="#8c959f" stroke-width="1.5"/><text x="54" y="142" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="14" font-weight="normal" fill="#e6edf3" text-anchor="start" xml:space="preserve" >$ rsync -a SRC  DEST/</text><text x="40" y="182" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start" xml:space="preserve" >SRC contains: a.txt  b.txt</text><text x="40" y="204" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Result:</text><rect x="40" y="214" width="300" height="96" rx="6" fill="#0d1117" stroke="#8c959f" stroke-width="1.5"/><text x="54" y="240" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="13" font-weight="normal" fill="#e6edf3" text-anchor="start" xml:space="preserve" >DEST/</text><text x="54" y="260" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="13" font-weight="normal" fill="#7ee787" text-anchor="start" xml:space="preserve" >  SRC/</text><text x="54" y="280" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="13" font-weight="normal" fill="#7ee787" text-anchor="start" xml:space="preserve" >    a.txt</text><text x="54" y="300" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="13" font-weight="normal" fill="#7ee787" text-anchor="start" xml:space="preserve" >    b.txt</text><rect x="530" y="80" width="440" height="270" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="750" y="106" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >slash: only the contents are copied</text><rect x="540" y="120" width="420" height="34" rx="6" fill="#0d1117" stroke="#8c959f" stroke-width="1.5"/><text x="554" y="142" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="14" font-weight="normal" fill="#e6edf3" text-anchor="start" xml:space="preserve" >$ rsync -a SRC/ DEST/</text><text x="540" y="182" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="start" xml:space="preserve" >SRC contains: a.txt  b.txt</text><text x="540" y="204" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Result:</text><rect x="540" y="214" width="300" height="76" rx="6" fill="#0d1117" stroke="#8c959f" stroke-width="1.5"/><text x="554" y="240" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="13" font-weight="normal" fill="#e6edf3" text-anchor="start" xml:space="preserve" >DEST/</text><text x="554" y="260" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="13" font-weight="normal" fill="#7ee787" text-anchor="start" xml:space="preserve" >  a.txt</text><text x="554" y="280" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="13" font-weight="normal" fill="#7ee787" text-anchor="start" xml:space="preserve" >  b.txt</text><text x="500" y="392" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >Tip: always run the same command with -n --itemize-changes first and read the tree it will make.</text>
</svg>
