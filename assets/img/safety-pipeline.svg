<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" width="1100" height="390" role="img" aria-labelledby="t d">
<title id="t">Safety pipeline</title>
<desc id="d">Seven boxes in a row: preflight, snapshot or backup, dry-run, execute, verify, remove original, log. A red dashed arrow from verify to a STOP box shows that any failure leaves the source untouched.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="389" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="550" y="38" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="22" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >The safety pipeline</text><text x="550" y="62" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >Every example in this guide maps to these seven steps</text><rect x="20" y="92" width="136" height="150" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/><circle cx="42" cy="116" r="13" fill="#1a7f37"/><text x="42" y="121" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve" >1</text><circle cx="136" cy="116" r="8" fill="#1a7f37"/><text x="88.0" y="160" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >PREFLIGHT</text><text x="88.0" y="190" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >df, stat, lsof</text><text x="88.0" y="207" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >space, perms,</text><text x="88.0" y="224" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >path pitfalls</text><line x1="159" y1="167" x2="175" y2="167" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="178" y="92" width="136" height="150" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2.5"/><circle cx="200" cy="116" r="13" fill="#9a6700"/><text x="200" y="121" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve" >2</text><circle cx="294" cy="116" r="8" fill="#9a6700"/><text x="246.0" y="152" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >SNAPSHOT /</text><text x="246.0" y="170" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >BACKUP</text><text x="246.0" y="196" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >snapshot or</text><text x="246.0" y="213" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >extra copy</text><line x1="317" y1="167" x2="333" y2="167" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="336" y="92" width="136" height="150" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/><circle cx="358" cy="116" r="13" fill="#1a7f37"/><text x="358" y="121" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve" >3</text><circle cx="452" cy="116" r="8" fill="#1a7f37"/><text x="404.0" y="160" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >DRY-RUN</text><text x="404.0" y="190" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >rsync -n -i</text><text x="404.0" y="207" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >read the list</text><line x1="475" y1="167" x2="491" y2="167" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="494" y="92" width="136" height="150" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2.5"/><circle cx="516" cy="116" r="13" fill="#9a6700"/><text x="516" y="121" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve" >4</text><circle cx="610" cy="116" r="8" fill="#9a6700"/><text x="562.0" y="160" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >EXECUTE</text><text x="562.0" y="190" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >the real copy</text><text x="562.0" y="207" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >or change</text><line x1="633" y1="167" x2="649" y2="167" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="652" y="92" width="136" height="150" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/><circle cx="674" cy="116" r="13" fill="#1a7f37"/><text x="674" y="121" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve" >5</text><circle cx="768" cy="116" r="8" fill="#1a7f37"/><text x="720.0" y="160" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >VERIFY</text><text x="720.0" y="190" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >checksums,</text><text x="720.0" y="207" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >counts, cmp</text><line x1="791" y1="167" x2="807" y2="167" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="810" y="92" width="136" height="150" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2.5"/><circle cx="832" cy="116" r="13" fill="#cf222e"/><text x="832" y="121" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve" >6</text><circle cx="926" cy="116" r="8" fill="#cf222e"/><text x="878.0" y="152" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >REMOVE</text><text x="878.0" y="170" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >ORIGINAL</text><text x="878.0" y="196" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >trash-put,</text><text x="878.0" y="213" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >never rm first</text><line x1="949" y1="167" x2="965" y2="167" stroke="#1f2328" stroke-width="2" marker-end="url(#ar)"/><rect x="968" y="92" width="136" height="150" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5"/><circle cx="990" cy="116" r="13" fill="#1a7f37"/><text x="990" y="121" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" xml:space="preserve" >7</text><circle cx="1084" cy="116" r="8" fill="#1a7f37"/><text x="1036.0" y="160" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >LOG</text><text x="1036.0" y="190" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >what, when,</text><text x="1036.0" y="207" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >manifest</text><path d="M 720 244 L 720 292" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr)"/><rect x="480" y="296" width="480" height="64" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/><text x="720" y="322" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" font-weight="bold" fill="#cf222e" text-anchor="middle" xml:space="preserve" >STOP at any failure: the source is still untouched</text><text x="720" y="344" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >A failed verify never leads to step 6</text><text x="60" y="300" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="bold" fill="#57606a" text-anchor="start" xml:space="preserve" >Risk</text><circle cx="70" cy="320" r="6" fill="#1a7f37"/><text x="84" y="325" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >read-only</text><circle cx="70" cy="342" r="6" fill="#9a6700"/><text x="84" y="347" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >modifies</text><circle cx="70" cy="364" r="6" fill="#cf222e"/><text x="84" y="369" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >destructive</text>
</svg>
