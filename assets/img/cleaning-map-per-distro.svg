<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-labelledby="t d">
<title id="t">Per-distro cleaning map</title>
<desc id="d">A grid with columns for Debian/Ubuntu, Fedora/RHEL, Arch, openSUSE and Alpine and rows for package cache, unneeded packages and old kernels, listing the preview or safest command for each.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="1099" height="419" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="550" y="32" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="21" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >System cleaning map by distro family</text><text x="550" y="54" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" font-weight="normal" fill="#57606a" text-anchor="middle" xml:space="preserve" >Preview first. The listed command is the preview or the safest form; see chapter 10 for the apply step.</text><rect x="130" y="70" width="180" height="34" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="220.0" y="92" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Debian / Ubuntu</text><rect x="314" y="70" width="180" height="34" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="404.0" y="92" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Fedora / RHEL</text><rect x="498" y="70" width="180" height="34" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="588.0" y="92" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Arch</text><rect x="682" y="70" width="180" height="34" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="772.0" y="92" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >openSUSE</text><rect x="866" y="70" width="180" height="34" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="956.0" y="92" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="middle" xml:space="preserve" >Alpine</text><text x="20" y="148" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Package cache</text><rect x="130" y="112" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="220.0" y="150" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >apt-get clean</text><rect x="314" y="112" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="404.0" y="150" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >dnf clean all</text><rect x="498" y="112" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="588.0" y="150" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >paccache -d (preview)</text><rect x="682" y="112" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="772.0" y="150" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >zypper clean</text><rect x="866" y="112" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="956.0" y="150" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >apk cache clean</text><text x="20" y="222" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Unneeded pkgs</text><rect x="130" y="186" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="220.0" y="224" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >apt-get -s autoremove</text><rect x="314" y="186" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="404.0" y="224" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >dnf autoremove --assumeno</text><rect x="498" y="186" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="588.0" y="224" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >pacman -Qtdq</text><rect x="682" y="186" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="772.0" y="224" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >zypper packages --unneeded</text><rect x="866" y="186" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="956.0" y="224" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >no autoremove: apk del</text><text x="20" y="296" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Old kernels</text><rect x="130" y="260" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="220.0" y="298" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >autoremove (review)</text><rect x="314" y="260" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="404.0" y="298" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >installonly_limit</text><rect x="498" y="260" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="588.0" y="298" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >remove by hand</text><rect x="682" y="260" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="772.0" y="298" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >zypper purge-kernels</text><rect x="866" y="260" width="180" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="956.0" y="298" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="10.5" font-weight="normal" fill="#1f2328" text-anchor="middle" xml:space="preserve" >apk del linux-OLD</text><text x="20" y="368" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Everywhere</text><rect x="130" y="334" width="916" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="146" y="360" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >journalctl --disk-usage  |  flatpak uninstall --unused --assumeno  |  docker system df</text><text x="146" y="382" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace' font-size="12" font-weight="normal" fill="#1f2328" text-anchor="start" xml:space="preserve" >du -sh ~/.cache  |  coredumpctl list  |  nix-collect-garbage --dry-run (NixOS)</text>
</svg>
