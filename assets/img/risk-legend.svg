<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" width="800" height="232" role="img" aria-labelledby="t d">
<title id="t">Risk legend</title>
<desc id="d">Three rows: green means read-only, amber means modifies or creates data, red means destructive or irreversible.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="231" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="20" y="34" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="18" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >Risk labels used in this guide</text><rect x="20" y="56" width="760" height="46" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/><circle cx="46" cy="79" r="10" fill="#1a7f37"/><text x="68" y="76" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >GREEN  read-only</text><text x="68" y="93" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" xml:space="preserve" >Inspects only. Safe to repeat: ls, stat, df, rsync -n, find -print, sha256sum.</text><rect x="20" y="112" width="760" height="46" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/><circle cx="46" cy="135" r="10" fill="#9a6700"/><text x="68" y="132" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >AMBER  modifies / creates</text><text x="68" y="149" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" xml:space="preserve" >Writes new data or edits in place. Recoverable if you kept a snapshot or the source: cp, rsync copy, tar x.</text><rect x="20" y="168" width="760" height="46" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/><circle cx="46" cy="191" r="10" fill="#cf222e"/><text x="68" y="188" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" font-weight="bold" fill="#1f2328" text-anchor="start" xml:space="preserve" >RED  destructive / irreversible</text><text x="68" y="205" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" font-weight="normal" fill="#57606a" text-anchor="start" xml:space="preserve" >Data is gone after this. Needs a verified copy first: rm, rsync --delete, shred, mkfs, dd of=.</text>
</svg>
